<!doctype html>
<html lang="en" data-style="{% block style %}v2{% endblock %}" data-style-lock="{% block style_lock %}{% endblock %}" data-theme="light">
<head>
  {% include "partials/head.html" %}
  <title>{% block title %}Design catalogue{% endblock %}</title>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="lab-header">
    <a class="lab-brand" href="{{ root }}screens/index.html">
      <span class="lab-brand__mark" aria-hidden="true"></span>
      <span>Design catalogue</span>
    </a>
    <nav class="lab-nav" aria-label="Catalogue">
      <a href="{{ root }}screens/index.html">Screens</a>
      <a href="{{ root }}playground/index.html">Playground</a>
    </nav>
    <div class="lab-controls">
      <button type="button" data-toggle="style">Style: <span data-style-label>v2</span></button>
      <button type="button" data-toggle="theme">Theme: <span data-theme-label>light</span></button>
    </div>
  </header>
  <main id="main" class="{% block main_class %}lab-main{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="lab-footer">
    <p><code>_DESIGN</code> is a visual laboratory. Data is synthetic.</p>
  </footer>
  <script src="{{ root }}js/design.js"></script>
</body>
</html>
